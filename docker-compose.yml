services:
  db:
    image: postgres:16-alpine
    container_name: game3alhaq-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=game3alhaq_db
    ports:
      - "5432:5432"
    volumes:
      - game3alhaq_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  game3alhaq_pgdata:
