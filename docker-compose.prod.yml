name: game3alhaq-prod

services:
  db:
    image: postgres:16-alpine
    container_name: game3alhaq-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-game3alhaq_prod_db}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - game3alhaq_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-game3alhaq_prod_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/fahdmarwandev-tech/elha2backend:latest}
    container_name: game3alhaq-prod-backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_LOCAL_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-game3alhaq_prod_db}
      - DB_LOCAL_USERNAME=${POSTGRES_USER:-postgres}
      - DB_LOCAL_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8082:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  game3alhaq_prod_postgres_data:
